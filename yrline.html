<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!-- 모바일 화면 비율을 맞춰주는 뷰포트 태그 추가 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,body{
  margin:0;
  width:100vw;
  height:100vh;
  background:transparent;
  overflow:hidden;
}

#border{
  position:fixed;
  inset:0;
  box-sizing:border-box;
  border:40px solid rgba(0,0,0,0);
  pointer-events:none;
  transition:border-color .5s;
}

#infoDisplay{
  position:fixed;
  right:30px;
  /* 아래 두 줄이 오른쪽 중앙 정렬을 위한 핵심 코드입니다 */
  top:50%;
  transform:translateY(-50%);
  
  font-family:Arial,sans-serif;
  font-size:54px; /* 두 줄 표시를 위해 폰트 크기를 54px로 살짝 조정 (필요시 수정 가능) */
  font-weight:900;
  color:#ff3030;
  text-shadow:0 0 10px rgba(0,0,0,.8);
  display:none;
  pointer-events:none;
  text-align:right; /* 글자를 우측으로 깔끔하게 정렬 */
  line-height:1.2;  /* 줄 간격 조정 */
}

</style>
</head>
<body>
<div id="border"></div>
<!-- 기존 rttDisplay에서 infoDisplay로 이름 변경 -->
<div id="infoDisplay"></div>

<script>
const config={
  page:'https://stats.srt.belabox.net/kuB3M4uQugvgXpcF1OoSSpTslnZf3H',
  key:'live',
  interval:2000
};

async function getStats(){
  try{
    const r=await fetch(config.page);
    const j=await r.json();
    return j.publishers[config.key];
  }catch(e){
    return null;
  }
}

async function update(){
  const stats=await getStats();
  const border=document.getElementById('border');
  const infoDisplay=document.getElementById('infoDisplay');

  // 연결이 끊겼거나 데이터를 못 받아올 때 (기본 빨간 테두리 처리)
  if(!stats || !stats.rtt){
    border.style.borderColor='rgba(150, 150, 150, 0.25)';
    infoDisplay.style.display='none';
    return;
  }

  const rtt = Math.round(stats.rtt);
  // 벨라박스 API에서 들어오는 bitrate 값을 숫자로 변환
  // (만약 API에서 bps 단위로 줘서 값이 너무 크다면 Number(stats.bitrate||0) / 1000 으로 수정해서 사용하세요)
  const bitrate = Math.round(Number(stats.bitrate || 0));

  // 1순위: 빨간색 조건 (위험 상태)
  // 비트레이트 1000 이하 이거나 rtt 2000 이상일 때
  if(bitrate <= 1000 || rtt >= 2000){
    border.style.borderColor = 'rgba(255,0,0,0.35)'; // 빨간색 테두리
    infoDisplay.innerHTML = `${bitrate} Kb<br>${rtt} ms`; // 비트레이트와 RTT 표시
    infoDisplay.style.display = 'block';
  }
  // 2순위: 노란색 조건 (주의 상태)
  // 비트레이트 2000 이하 이거나 rtt 1000 이상일 때 (빨간색 조건에 해당하지 않는 경우에만 실행됨)
  else if(bitrate <= 2000 || rtt >= 1000){
    border.style.borderColor = 'rgba(255,255,0,0.25)'; // 노란색 테두리
    infoDisplay.style.display = 'none'; // 텍스트 숨김
  }
  // 3순위: 정상 상태 (그 외 모든 경우)
  else {
    border.style.borderColor = 'rgba(0,0,0,0)'; // 테두리 투명
    infoDisplay.style.display = 'none'; // 텍스트 숨김
  }
}

update();
setInterval(update, config.interval);
</script>
</body>
</html>
